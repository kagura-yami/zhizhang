name: zhizhang

services:
  postgres:
    image: postgres:16-alpine
    container_name: zhizhang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
    image: zhizhang-backend:local
    container_name: zhizhang-backend
    ports:
      - '3006:3006'
    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public
    env_file:
      - .env
      - .env.admin
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    # 发布前显式备份并执行增量迁移；服务重启不得自动更改数据库结构。
    command: ['node', 'dist/main.js']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3006/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
    name: zhizhang-postgres-data
    external: true
